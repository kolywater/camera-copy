name: CameraCopy
options:
  bundleIdPrefix: com.aiden
  deploymentTarget:
    macOS: "14.0"
targets:
  CameraCopy:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiden.CameraCopy
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camera Copy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: Camera Copy reads photos and videos from your camera's SD card.
        MARKETING_VERSION: "1.1"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N8666MD6Y8
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
