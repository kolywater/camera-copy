name: CameraCopy
options:
  bundleIdPrefix: com.aiden
  deploymentTarget:
    macOS: "14.0"
targets:
  CameraCopy:
    type: application
    platform: macOS
    sources:
      - Sources
      # The independent check, bundled unchanged (Camera Copy runs it with /bin/bash).
      - path: tools/verify-card.sh
        buildPhase: resources
    postBuildScripts:
      - name: Check bundled verify-card.sh is byte-for-byte tools/verify-card.sh
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/tools/verify-card.sh
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/verify-card.sh
        script: |
          if ! cmp -s "$SRCROOT/tools/verify-card.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/verify-card.sh"; then
            echo "error: the bundled verify-card.sh differs from tools/verify-card.sh"
            exit 1
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiden.CameraCopy
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Camera Copy
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSRemovableVolumesUsageDescription: Camera Copy reads photos and videos from your camera's SD card.
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N8666MD6Y8
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [CameraCopyTests]
      gatherCoverageData: true

  # Unit tests. They compile the app's sources directly (everything but the @main app file),
  # so they run without launching the app.
  CameraCopyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources
        excludes: ["CameraCopyApp.swift", "Assets.xcassets"]
      - Tests
      - path: tools/verify-card.sh
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiden.CameraCopyTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N8666MD6Y8

  # UI test: clicks the real update button. Separate scheme, run with `just test-ui` (needs Accessibility).
  CameraCopyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: CameraCopy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiden.CameraCopyUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: CameraCopy
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: N8666MD6Y8

schemes:
  CameraCopyUITests:
    build:
      targets:
        CameraCopy: all
        CameraCopyUITests: [test]
    test:
      targets: [CameraCopyUITests]
